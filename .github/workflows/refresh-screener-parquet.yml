name: Refresh Shared Market Data

on:
  schedule:
    - cron: "15 14 * * *" # 7:45 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-market-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify current constituents and preserve dated history
        run: python scripts/refresh_constituents.py

      - name: Refresh shared full-history pricing file
        run: |
          python scripts/refresh_market_data.py

      - name: Commit refreshed parquet
        run: |
          if git diff --quiet -- data/screener_ohlcv.parquet data/constituents.parquet; then
            echo "No screener parquet changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screener_ohlcv.parquet data/constituents.parquet
          git commit -m "data: refresh shared market sources" \
            -m "Daily full-history publication for all app sections after market close."
          git push
